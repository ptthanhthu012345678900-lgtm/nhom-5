<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhóm 5 — Bộ thủ động vật</title>
<style>
:root{
  --paper:#faf6ef; --ink:#2b2620; --muted:#8a7d6c;
  --line:#e8dcc8; --accent:#b85a1a; --accent-soft:#f5e0c8;
  --cjk:"Noto Serif CJK SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     background:var(--paper);color:var(--ink);line-height:1.5}
main{max-width:660px;margin:0 auto;padding:24px 18px 56px}
h1{font-size:.9rem;font-weight:600;margin:0 0 4px;text-align:center;
   color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
h1 + p{text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 16px}

.stage{background:#fff;border-radius:26px;padding:10px;
       border:1.5px solid var(--line);overflow:hidden;
       box-shadow:0 8px 32px rgba(184,90,26,.08)}
svg#fig{width:100%;height:auto;display:block}

.hotspot{cursor:pointer;outline:none;
  transform-box:fill-box;transform-origin:center;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.hotspot:hover{transform:scale(1.14)}
.hotspot circle{
  fill:url(#spot);stroke:var(--accent);stroke-width:1.8;
  filter:drop-shadow(0 2px 4px rgba(184,90,26,.3));
  transition:fill .2s,stroke-width .2s;
}
.hotspot .glyph{
  font-family:var(--cjk);font-size:20px;fill:var(--ink);
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;transition:fill .2s;
}
.hotspot.sel{transform:scale(1.14)}
.hotspot.sel circle{fill:var(--accent);stroke:#7a3a0a;stroke-width:2.5}
.hotspot.sel .glyph{fill:#fff}
.hotspot:focus-visible circle{stroke-width:4}

.card{background:#fff;border-radius:26px;border:1.5px solid var(--line);
      padding:28px 20px 26px;margin-top:14px;text-align:center;min-height:280px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 8px 32px rgba(184,90,26,.08)}
.card .icon{font-size:76px;line-height:1;margin-bottom:12px;
             filter:drop-shadow(0 4px 10px rgba(0,0,0,.12))}
.card .glyph{font-family:var(--cjk);font-size:62px;line-height:1;
             color:var(--accent);margin-bottom:4px}
.card .variant{font-family:var(--cjk);font-size:.95rem;color:var(--muted);
               margin-bottom:6px}
.card .pron{font-size:1.3rem;margin:0 0 2px;letter-spacing:.02em}
.card .pron .hv{color:var(--muted);margin-left:8px;font-size:1rem;letter-spacing:0}
.card .meaning{font-size:1.3rem;font-weight:600;margin:0 0 20px;
               color:var(--accent)}
.card .examples{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.card .ex{display:flex;flex-direction:column;align-items:center;gap:1px;
          padding:8px 12px;border-radius:12px;background:#fdfaf5;
          border:1px solid var(--line);min-width:60px}
.card .ex .c{font-family:var(--cjk);font-size:26px;line-height:1.15}
.card .ex .hv{font-size:.7rem;color:var(--muted)}
.card .ex .m{font-size:.78rem}
.card .hint{color:var(--muted);font-size:1.1rem}
</style>
</head>
<body>
<main>
  <h1>Nhóm 5 — Bộ thủ động vật</h1>
  <p>Chạm vào một con vật</p>

  <section class="stage">
    <svg id="fig" viewBox="0 0 500 420" role="img" aria-label="Đồng cỏ với các con vật">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a0d0e8"/>
          <stop offset="70%" stop-color="#dce8ee"/>
          <stop offset="100%" stop-color="#f5ead4"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a4cc80"/>
          <stop offset="100%" stop-color="#4f7a30"/>
        </linearGradient>
        <radialGradient id="pond" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#a4dcef"/>
          <stop offset="100%" stop-color="#3a88b8"/>
        </radialGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffce0"/>
          <stop offset="100%" stop-color="#ffd23f"/>
        </radialGradient>
        <radialGradient id="spot" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff"/>
          <stop offset="100%" stop-color="#f8ecdf"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>

      <!-- bầu trời -->
      <rect width="500" height="420" fill="url(#sky)"/>

      <!-- mặt trời -->
      <circle cx="60" cy="50" r="26" fill="#ffd23f" opacity="0.25" filter="url(#blur)"/>
      <circle cx="60" cy="50" r="16" fill="url(#sun)"/>

      <!-- mây -->
      <ellipse cx="380" cy="55" rx="32" ry="10" fill="#fff" opacity="0.7"/>
      <ellipse cx="405" cy="50" rx="24" ry="12" fill="#fff" opacity="0.7"/>

      <!-- đồi xa -->
      <path d="M0 290 Q140 250 260 275 Q390 245 500 275 L500 305 L0 305 Z"
            fill="#a8c890" opacity="0.75"/>

      <!-- đồng cỏ -->
      <path d="M0 290 Q250 275 500 295 L500 420 L0 420 Z" fill="url(#grass)"/>

      <!-- cái ao nhỏ -->
      <ellipse cx="445" cy="390" rx="52" ry="18" fill="url(#pond)"/>
      <ellipse cx="445" cy="390" rx="38" ry="12" fill="#7fc4dc" opacity="0.35"/>
      <ellipse cx="438" cy="386" rx="14" ry="3" fill="#fff" opacity="0.4"/>

      <!-- hoa cho bướm đậu -->

        <circle cx="410" cy="255" r="5" fill="#ffcb47"/>
        <circle cx="404" cy="248" r="5" fill="#ff8ab4"/>
        <circle cx="416" cy="248" r="5" fill="#ff8ab4"/>
        <circle cx="405" cy="262" r="5" fill="#ff8ab4"/>
        <circle cx="415" cy="262" r="5" fill="#ff8ab4"/>
        <circle cx="410" cy="255" r="3.5" fill="#fff5b0"/>
      </g>

      <!-- ===== BÒ (牛) — bên trái ===== -->
      <g id="ox">
        <!-- đuôi -->
        <path d="M58 335 Q48 345 52 358" stroke="#8a5a30" stroke-width="2.5"
              fill="none" stroke-linecap="round"/>
        <ellipse cx="52" cy="360" rx="3" ry="4.5" fill="#6a3a1a"/>
        <!-- 4 chân -->
        <line x1="72"  y1="352" x2="70"  y2="378" stroke="#6a3a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="88"  y1="352" x2="86"  y2="378" stroke="#6a3a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="108" y1="352" x2="106" y2="378" stroke="#6a3a1a" stroke-width="6" stroke-linecap="round"/>
        <line x1="122" y1="352" x2="120" y2="378" stroke="#6a3a1a" stroke-width="6" stroke-linecap="round"/>
        <!-- móng -->
        <ellipse cx="70"  cy="380" rx="5" ry="2.5" fill="#2a2a2a"/>
        <ellipse cx="86"  cy="380" rx="5" ry="2.5" fill="#2a2a2a"/>
        <ellipse cx="106" cy="380" rx="5" ry="2.5" fill="#2a2a2a"/>
        <ellipse cx="120" cy="380" rx="5" ry="2.5" fill="#2a2a2a"/>
        <!-- thân -->
        <ellipse cx="98" cy="335" rx="42" ry="20" fill="#d0a878"/>
        <ellipse cx="98" cy="342" rx="42" ry="13" fill="#f0d8b8"/>
        <!-- đốm -->
        <ellipse cx="85" cy="325" rx="10" ry="7" fill="#8a5a30" opacity="0.85"/>
        <ellipse cx="112" cy="330" rx="8" ry="6" fill="#8a5a30" opacity="0.85"/>
        <!-- đầu -->
        <ellipse cx="145" cy="322" rx="16" ry="14" fill="#d0a878"/>
        <!-- sừng -->
        <path d="M137 312 Q130 300 135 295" stroke="#5a3a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M153 312 Q160 300 155 295" stroke="#5a3a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- tai -->
        <ellipse cx="130" cy="318" rx="5" ry="3.5" fill="#8a5a30" transform="rotate(-20 130 318)"/>
        <!-- mắt -->
        <circle cx="152" cy="318" r="1.8" fill="#2b2620"/>
        <!-- mũi -->
        <ellipse cx="158" cy="328" rx="4" ry="3" fill="#6a3a1a"/>
        <circle cx="156" cy="328" r="0.8" fill="#2a1a0a"/>
        <circle cx="160" cy="328" r="0.8" fill="#2a1a0a"/>
      </g>

      <!-- ===== CHÓ (犬) — giữa trái ===== -->
      <g id="dog">
        <!-- đuôi cong -->
        <path d="M195 335 Q178 320 184 308" stroke="#c98a4a" stroke-width="5"
              fill="none" stroke-linecap="round"/>
        <!-- thân -->
        <ellipse cx="228" cy="342" rx="32" ry="15" fill="#e0a868"/>
        <!-- 4 chân -->
        <line x1="208" y1="352" x2="208" y2="375" stroke="#c98a4a" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="220" y1="352" x2="220" y2="375" stroke="#c98a4a" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="238" y1="352" x2="238" y2="375" stroke="#c98a4a" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="250" y1="352" x2="250" y2="375" stroke="#c98a4a" stroke-width="5.5" stroke-linecap="round"/>
        <!-- bàn chân -->
        <ellipse cx="208" cy="377" rx="5" ry="2.5" fill="#8a5020"/>
        <ellipse cx="220" cy="377" rx="5" ry="2.5" fill="#8a5020"/>
        <ellipse cx="238" cy="377" rx="5" ry="2.5" fill="#8a5020"/>
        <ellipse cx="250" cy="377" rx="5" ry="2.5" fill="#8a5020"/>
        <!-- đầu -->
        <circle cx="262" cy="328" r="14" fill="#e0a868"/>
        <!-- tai -->
        <ellipse cx="255" cy="318" rx="5" ry="9" fill="#b87a3a" transform="rotate(-25 255 318)"/>
        <!-- mõm -->
        <ellipse cx="274" cy="332" rx="6" ry="4" fill="#c98a4a"/>
        <circle cx="278" cy="331" r="1.5" fill="#2a1a0a"/>
        <!-- mắt -->
        <circle cx="265" cy="324" r="1.6" fill="#2b2620"/>
      </g>

      <!-- ===== NGỰA (马) — giữa phải ===== -->
      <g id="horse">
        <!-- đuôi -->
        <path d="M322 322 Q298 328 304 358" stroke="#5a3a20" stroke-width="6"
              fill="none" stroke-linecap="round"/>
        <!-- 4 chân -->
        <line x1="340" y1="342" x2="340" y2="378" stroke="#7a4a20" stroke-width="6" stroke-linecap="round"/>
        <line x1="355" y1="342" x2="355" y2="378" stroke="#7a4a20" stroke-width="6" stroke-linecap="round"/>
        <line x1="372" y1="342" x2="372" y2="378" stroke="#7a4a20" stroke-width="6" stroke-linecap="round"/>
        <line x1="387" y1="342" x2="387" y2="378" stroke="#7a4a20" stroke-width="6" stroke-linecap="round"/>
        <!-- móng -->
        <ellipse cx="340" cy="380" rx="5" ry="2.5" fill="#2a1a0a"/>
        <ellipse cx="355" cy="380" rx="5" ry="2.5" fill="#2a1a0a"/>
        <ellipse cx="372" cy="380" rx="5" ry="2.5" fill="#2a1a0a"/>
        <ellipse cx="387" cy="380" rx="5" ry="2.5" fill="#2a1a0a"/>
        <!-- thân -->
        <ellipse cx="362" cy="330" rx="42" ry="19" fill="#a87038"/>
        <!-- cổ -->
        <path d="M392 318 L406 285 L422 292 L402 335 Z" fill="#a87038"/>
        <!-- bờm -->
        <path d="M398 296 Q408 280 420 274" stroke="#5a3a20" stroke-width="3" fill="none"/>
        <!-- đầu -->
        <ellipse cx="418" cy="283" rx="16" ry="10" fill="#a87038" transform="rotate(-25 418 283)"/>
        <!-- tai -->
        <path d="M410 275 L411 266 L418 273 Z" fill="#7a4a20"/>
        <!-- mõm -->
        <ellipse cx="432" cy="279" rx="4.5" ry="3" fill="#7a4a20" transform="rotate(-25 432 279)"/>
        <!-- mắt -->
        <circle cx="423" cy="280" r="1.6" fill="#2b2620"/>
      </g>

      <!-- ===== CHIM (鸟) — trên trời ===== -->
      <g id="bird">
        <!-- đuôi -->
        <path d="M148 72 L132 68 L138 80 Z" fill="#3a6cc0"/>
        <!-- cánh -->
        <path d="M165 66 Q178 46 198 56 Q188 70 165 66 Z" fill="#3a6cc0"/>
        <!-- thân -->
        <ellipse cx="173" cy="70" rx="24" ry="10" fill="#5a9ae0"/>
        <!-- đầu -->
        <circle cx="198" cy="63" r="9" fill="#5a9ae0"/>
        <!-- mỏ -->
        <path d="M207 61 L218 64 L207 67 Z" fill="#ffb84d"/>
        <!-- mắt -->
        <circle cx="201" cy="61" r="1.6" fill="#2b2620"/>
      </g>

      <!-- ===== BƯỚM (虫) — trên hoa ===== -->
      <g id="butterfly">
        <!-- râu -->
        <path d="M408 232 L404 220" stroke="#2b2620" stroke-width="1.2" fill="none"/>
        <path d="M414 232 L418 220" stroke="#2b2620" stroke-width="1.2" fill="none"/>
        <circle cx="404" cy="220" r="1.2" fill="#2b2620"/>
        <circle cx="418" cy="220" r="1.2" fill="#2b2620"/>
        <!-- cánh trên -->
        <ellipse cx="400" cy="238" rx="9" ry="12" fill="#ff8ab4"
                 transform="rotate(-22 400 238)" opacity="0.92"/>
        <ellipse cx="422" cy="238" rx="9" ry="12" fill="#ff8ab4"
                 transform="rotate(22 422 238)" opacity="0.92"/>
        <!-- cánh dưới -->
        <ellipse cx="403" cy="250" rx="6.5" ry="8" fill="#ffcb47"
                 transform="rotate(-15 403 250)" opacity="0.92"/>
        <ellipse cx="419" cy="250" rx="6.5" ry="8" fill="#ffcb47"
                 transform="rotate(15 419 250)" opacity="0.92"/>
        <!-- thân -->
        <ellipse cx="411" cy="243" rx="1.8" ry="10" fill="#2b2620"/>
      </g>

      <!-- ===== CÁ (鱼) — trong ao ===== -->
      <g id="fish">
        <!-- đuôi -->
        <path d="M418 393 L402 383 L402 403 Z" fill="#e87a20"/>
        <!-- thân -->
        <ellipse cx="440" cy="393" rx="20" ry="9" fill="#ff9e42"/>
        <!-- vây lưng -->
        <path d="M434 384 L444 378 L452 387 Z" fill="#e87a20"/>
        <!-- vây bụng -->
        <path d="M434 402 L442 406 L448 400 Z" fill="#e87a20"/>
        <!-- vảy -->
        <path d="M432 393 Q438 388 444 393" stroke="#e87a20" stroke-width="1" fill="none"/>
        <path d="M442 393 Q448 388 454 393" stroke="#e87a20" stroke-width="1" fill="none"/>
        <!-- mắt -->
        <circle cx="454" cy="391" r="1.8" fill="#2b2620"/>
        <!-- bong bóng -->
        <circle cx="460" cy="387" r="1.5" fill="#fff" opacity="0.75"/>
      </g>

      <g id="hotspots"></g>
    </svg>
  </section>

  <section class="card" id="card"></section>
</main>

<script>
const NS = "http://www.w3.org/2000/svg";

/* ==== 6 bộ thủ động vật ==== */
const RADICALS = {
  niu:  {glyph:"牛", variant:"",   pinyin:"niú",  hv:"ngưu",  meaning:"bò",        icon:"🐂",
         ex:[{c:"特",hv:"đặc",m:"đặc biệt"},{c:"物",hv:"vật",m:"vật"},{c:"牧",hv:"mục",m:"chăn"}]},
  quan: {glyph:"犬", variant:"犭", pinyin:"quǎn", hv:"khuyển",meaning:"chó",       icon:"🐕",
         ex:[{c:"狗",hv:"cẩu",m:"chó"},{c:"猫",hv:"miêu",m:"mèo"},{c:"猪",hv:"trư",m:"lợn"}]},
  ma:   {glyph:"马", variant:"",   pinyin:"mǎ",   hv:"mã",    meaning:"ngựa",      icon:"🐴",
         ex:[{c:"骑",hv:"kỵ",m:"cưỡi"},{c:"驾",hv:"giá",m:"lái xe"},{c:"驰",hv:"trì",m:"chạy nhanh"}]},
  niao: {glyph:"鸟", variant:"",   pinyin:"niǎo", hv:"điểu",  meaning:"chim",      icon:"🐦",
         ex:[{c:"鸡",hv:"kê",m:"gà"},{c:"鸭",hv:"áp",m:"vịt"},{c:"鸽",hv:"cáp",m:"bồ câu"}]},
  yu:   {glyph:"鱼", variant:"",   pinyin:"yú",   hv:"ngư",   meaning:"cá",        icon:"🐟",
         ex:[{c:"鲜",hv:"tiên",m:"tươi"},{c:"鲤",hv:"lý",m:"cá chép"},{c:"鲸",hv:"kình",m:"cá voi"}]},
  chong:{glyph:"虫", variant:"",   pinyin:"chóng",hv:"trùng", meaning:"côn trùng",  icon:"🦋",
         ex:[{c:"蜂",hv:"phong",m:"ong"},{c:"蚊",hv:"văn",m:"muỗi"},{c:"蛇",hv:"xà",m:"rắn"}]}
};

/* ==== vị trí hotspot ==== */
const SPOTS = [
  {id:"niao",  x:173, y:70,  r:16},   /* chim — trên trời */
  {id:"chong", x:411, y:242, r:14},   /* bướm — trên hoa */
  {id:"niu",   x:98,  y:335, r:18},   /* bò — bên trái */
  {id:"quan",  x:228, y:342, r:16},   /* chó — giữa trái */
  {id:"ma",    x:362, y:330, r:19},   /* ngựa — giữa phải */
  {id:"yu",    x:440, y:393, r:14}    /* cá — trong ao */
];

const panel    = document.getElementById("card");
const svgSpots = document.getElementById("hotspots");

SPOTS.forEach(s => {
  const r = RADICALS[s.id];
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","hotspot");
  g.setAttribute("tabindex","0");
  g.setAttribute("role","button");
  g.setAttribute("aria-label", r.pinyin + " " + r.hv);
  g.dataset.id = s.id;

  const c = document.createElementNS(NS,"circle");
  c.setAttribute("cx",s.x); c.setAttribute("cy",s.y); c.setAttribute("r",s.r);

  const t = document.createElementNS(NS,"text");
  t.setAttribute("class","glyph");
  t.setAttribute("x",s.x); t.setAttribute("y",s.y);
  t.textContent = r.glyph;

  g.append(c,t);
  g.addEventListener("click", () => select(s.id));
  g.addEventListener("keydown", e => {
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(s.id); }
  });
  svgSpots.appendChild(g);
});

function select(id){
  document.querySelectorAll(".hotspot").forEach(el =>
    el.classList.toggle("sel", el.dataset.id === id));
  renderCard(id);
}

function renderCard(id){
  const r = RADICALS[id];
  panel.innerHTML = `
    <div class="icon">${r.icon}</div>
    <div class="glyph">${r.glyph}</div>
    ${r.variant ? `<div class="variant">biến thể: ${r.variant}</div>` : ""}
    <p class="pron">${r.pinyin}<span class="hv">· ${r.hv}</span></p>
    <p class="meaning">${r.meaning}</p>
    <div class="examples">
      ${r.ex.map(x => `
        <div class="ex">
          <span class="c">${x.c}</span>
          <span class="hv">${x.hv}</span>
          <span class="m">${x.m}</span>
        </div>`).join("")}
    </div>`;
}

panel.innerHTML = `<p class="hint">👆 Chạm vào một con vật</p>`;
</script>
</body>
</html>
